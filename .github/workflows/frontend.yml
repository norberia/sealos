name: Build PR 7433 self-test frontend image

"on":
  push:
    branches: [codex/build-pr7433-selftest]
    paths: [.github/workflows/frontend.yml]
  workflow_dispatch:
    inputs:
      module:
        description: "desktop, providers/costcenter, or providers/license"
        required: true
        type: choice
        options:
          - desktop
          - providers/costcenter
          - providers/license
      push_image:
        description: "Push only the dedicated self-test tag to norberia GHCR"
        required: true
        type: boolean
        default: false
      push_image_tag:
        description: "Dedicated immutable self-test tag"
        required: true
        type: string
        default: node26-pr7433-fab78d7

env:
  SOURCE_SHA: fab78d7b35762011cc74775f6e7d6f244561a4c9
  SELFTEST_TAG: node26-pr7433-fab78d7

permissions:
  contents: read

jobs:
  select-modules:
    if: github.repository == 'norberia/sealos'
    runs-on: ubuntu-24.04
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - id: modules
        env:
          EVENT: ${{ github.event_name }}
          MODULE: ${{ inputs.module }}
        run: |
          if [ "$EVENT" = push ]; then
            echo 'modules=["desktop","providers/costcenter","providers/license"]' >> "$GITHUB_OUTPUT"
          else
            case "$MODULE" in
              desktop|providers/costcenter|providers/license) ;;
              *) exit 1 ;;
            esac
            echo "modules=$(jq -cn --arg module "$MODULE" '[$module]')" >> "$GITHUB_OUTPUT"
          fi

  image-build:
    needs: select-modules
    if: github.repository == 'norberia/sealos'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.select-modules.outputs.modules) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate scope
        env:
          MODULE: ${{ matrix.module }}
          TAG: ${{ inputs.push_image_tag || env.SELFTEST_TAG }}
          OWNER: ${{ github.repository_owner }}
        run: |
          test "$OWNER" = norberia
          test "$TAG" = "$SELFTEST_TAG"
          case "$MODULE" in
            desktop|providers/costcenter|providers/license) ;;
            *) echo "::error::Unsupported module"; exit 1 ;;
          esac
          echo "MODULE_NAME=$(basename "$MODULE")" >> "$GITHUB_ENV"
          echo "GHCR_REPO=ghcr.io/norberia/sealos-$(basename "$MODULE")-frontend" >> "$GITHUB_ENV"

      - name: Checkout exact Node PR source
        uses: actions/checkout@v4
        with:
          repository: norberia/sealos
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify source revision
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Application source: $SOURCE_SHA"
          echo "Workflow source: ${{ github.sha }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to personal GHCR
        if: github.event_name == 'push' || inputs.push_image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: norberia
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build application image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            name=${{ env.MODULE_NAME }}
            path=${{ matrix.module }}
          labels: |
            org.opencontainers.image.source=https://github.com/norberia/sealos
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.SELFTEST_TAG }}
          outputs: type=image,name=${{ env.GHCR_REPO }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' || inputs.push_image }}

      - name: Export architecture digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload architecture digest
        uses: actions/upload-artifact@v4
        with:
          name: pr7433-${{ env.MODULE_NAME }}-${{ matrix.arch }}-digest
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7

  image-release:
    name: Publish dedicated self-test manifest
    if: github.repository == 'norberia/sealos' && (github.event_name == 'push' || inputs.push_image)
    needs: [select-modules, image-build]
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.select-modules.outputs.modules) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set image identity
        env:
          MODULE: ${{ matrix.module }}
          TAG: ${{ inputs.push_image_tag || env.SELFTEST_TAG }}
        run: |
          test "$TAG" = "$SELFTEST_TAG"
          case "$MODULE" in
            desktop|providers/costcenter|providers/license) ;;
            *) exit 1 ;;
          esac
          echo "MODULE_NAME=$(basename "$MODULE")" >> "$GITHUB_ENV"
          echo "GHCR_REPO=ghcr.io/norberia/sealos-$(basename "$MODULE")-frontend" >> "$GITHUB_ENV"

      - name: Login to personal GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: norberia
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download architecture digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: pr7433-${{ env.MODULE_NAME }}-*-digest
          merge-multiple: true

      - name: Publish exactly one tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          IMAGE="$GHCR_REPO:$SELFTEST_TAG"
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::Dedicated self-test tag already exists; refusing overwrite"
            exit 1
          fi
          images=()
          for digest in *; do images+=("$GHCR_REPO@sha256:$digest"); done
          test "${#images[@]}" -eq 2
          docker buildx imagetools create -t "$IMAGE" "${images[@]}"

      - name: Verify remote registry manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          IMAGE="$GHCR_REPO:$SELFTEST_TAG"
          docker buildx imagetools inspect "$IMAGE" | tee "$RUNNER_TEMP/evidence/image-inspect.txt"
          docker buildx imagetools inspect "$IMAGE" --raw > "$RUNNER_TEMP/evidence/manifest.json"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | (index("amd64") != null and index("arm64") != null)' "$RUNNER_TEMP/evidence/manifest.json"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/evidence/application-source.txt"
          printf 'Image: %s\nSource: %s\n' "$IMAGE" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload registry evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr7433-${{ env.MODULE_NAME }}-registry-evidence
          path: ${{ runner.temp }}/evidence/*
          if-no-files-found: error
          retention-days: 7
